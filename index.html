<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Gallery</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .video-hero {
            width: 100%;
            max-width: 1200px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .video-hero h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 2.5em;
        }

        .video-hero__media {
            width: 100%;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            outline: none;
        }

        .video-hero__media:focus {
            outline: 2px solid #667eea;
        }

        @media (max-width: 768px) {
            .video-hero {
                padding: 20px;
            }

            .video-hero h1 {
                font-size: 1.8em;
            }
        }
    </style>
</head>
<body>
    <div class="video-hero">
        <h1>🎬 Video Gallery</h1>
        <video
            id="video-player"
            class="video-hero__media"
            controls
            playsinline
            preload="metadata"
            poster=""
        >
            <source src="https://raw.githubusercontent.com/RomanOleksieienko/media-assets/main/videos/img-8750.mp4" type="video/mp4">
            Your browser does not support the <code>video</code> element.
        </video>
    </div>
</body>
</html>
